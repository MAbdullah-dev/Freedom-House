# Manual production upload.
#
# The workflow on origin/main deploys on every push to main. Disable that
# workflow in the GitHub Actions UI before the first push of this file.
# Enable it again only after GitHub shows this version, which has no push
# trigger. This job does not run migrations, seeders, or config:cache.

name: Deploy production manually

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run authenticates and uploads nothing. upload syncs the built app.
        required: true
        type: choice
        options:
          - dry-run
          - upload
        default: dry-run
      confirmation:
        description: Type DRY-RUN for a dry run, or DEPLOY for an upload.
        required: true
        type: string
      protocol:
        description: Use ftps when the host supports it.
        required: true
        type: choice
        options:
          - ftp
          - ftps
          - ftps-legacy
        default: ftp

permissions:
  contents: read

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "dry-run" ] && [ "$CONFIRMATION" != "DRY-RUN" ]; then
            echo "A dry run requires the confirmation DRY-RUN."
            exit 1
          fi
          if [ "$MODE" = "upload" ] && [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "An upload requires the confirmation DEPLOY."
            exit 1
          fi

      - name: Require deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER}" ] || [ -z "${FTP_USERNAME}" ] || [ -z "${FTP_PASSWORD}" ] || [ -z "${FTP_SERVER_DIR}" ]; then
            echo "Set the production environment secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, and FTP_SERVER_DIR."
            exit 1
          fi
          case "${FTP_SERVER_DIR}" in
            */) ;;
            *)
              echo "FTP_SERVER_DIR must be the Laravel root and must end with a slash."
              exit 1
              ;;
          esac
          echo "Upload target directory is configured."

      - name: Check out the release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-scripts --optimize-autoloader --no-interaction --prefer-dist

      - name: Discover packages with a throwaway key
        run: |
          set -euo pipefail
          export APP_ENV=production
          export APP_DEBUG=false
          export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          php artisan package:discover --ansi
          unset APP_KEY
          rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/events.php
          test -f bootstrap/cache/packages.php
          test -f bootstrap/cache/services.php

      - name: Install Node and build assets
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build Vite assets
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Remove files that must stay off the server
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf .git .github tests node_modules storage .phpunit.cache
          rm -f .env .env.* auth.json phpunit.xml phpunit.xml.dist public/hot
          for path in .git .github tests node_modules storage .env auth.json phpunit.xml public/hot; do
            if [ -e "$path" ]; then
              echo "Refusing to deploy because ${path} is still present."
              exit 1
            fi
          done
          if compgen -G ".env.*" > /dev/null; then
            echo "Refusing to deploy because an environment file is still present."
            exit 1
          fi
          test -f vendor/autoload.php
          test -f vendor/laravel/framework/composer.json
          test ! -e vendor/barryvdh/laravel-debugbar
          test -f public/build/manifest.json
          test -f public/index.php
          test -f artisan
          test -d database/migrations
          test ! -f bootstrap/cache/config.php
          echo "Artifacts verified. Migrations will not be run."

      - name: Upload the built application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ inputs.protocol }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          dry-run: ${{ inputs.mode == 'dry-run' }}
          log-level: minimal
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/.env
            **/.env.*
            .env
            .env.*
            **/auth.json
            **/phpunit.xml
            **/phpunit.xml.dist
            **/.phpunit.cache/**
            **/public/hot
            **/Homestead.json
            **/Homestead.yaml
